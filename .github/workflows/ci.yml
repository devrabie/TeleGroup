name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
        env:
          BOT_TOKEN: "1:test"
          API_ID: "1"
          API_HASH: hash
          ADMIN_IDS: "1"
          DATABASE_URL: sqlite+aiosqlite:////tmp/telegroup-ci.db
          SESSION_ENCRYPTION_KEY: qoaGk05XJfuMlnrnND1-suk6JtqXR-Y04CWEJNH5KgU=
